<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>누르 온라인 — 마스지드 알하람</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@500;700&family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;600&family=Noto+Sans+SC:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:rgba(16,16,16,.6);--bd:rgba(255,255,255,.16);--tx:#f3f3f1;--mu:#a9a9a4;--hi:#ffffff}
html,body{height:100%;overflow:hidden;background:#111;color:var(--tx);font-family:"Noto Sans KR","Noto Naskh Arabic","Noto Sans SC","Malgun Gothic","Apple SD Gothic Neo",sans-serif;font-weight:400;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:fixed;z-index:5;pointer-events:none}
.panel{background:var(--bg);border:1px solid var(--bd);border-radius:14px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#info{top:14px;inset-inline-start:14px;min-width:210px;padding:12px 14px;font-size:13px;line-height:1.45}
#clock{font-size:30px;font-weight:300;letter-spacing:1px;font-variant-numeric:tabular-nums;line-height:1}
#cityLbl{font-size:11px;color:var(--mu);margin:4px 0 8px;letter-spacing:.5px}
#info .row1{font-size:13px}#curP{font-weight:500}
#nextP{font-size:12px;color:var(--mu);margin:2px 0 8px}
.stat{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid var(--bd);padding-top:7px;margin-top:4px;font-size:12px}
.drops{display:flex;gap:4px}.drops i{width:8px;height:8px;border-radius:50%;border:1px solid #fff;opacity:.5}.drops i.on{background:#fff;opacity:1}
#top{top:14px;inset-inline-end:14px;display:flex;gap:6px;pointer-events:auto;flex-wrap:wrap;justify-content:flex-end;max-width:60vw}
button{font:inherit;color:var(--tx);cursor:pointer;border:1px solid rgba(255,255,255,.32);background:rgba(16,16,16,.45);border-radius:10px;padding:8px 13px;font-size:13px;letter-spacing:.2px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:background .15s,transform .06s}
button:hover{background:rgba(255,255,255,.12)}button:active{transform:scale(.97)}
button.primary,button.gold{background:#f3f3f1;color:#111;border-color:#f3f3f1;font-weight:500}button.primary:hover,button.gold:hover{background:#fff}
button.sel{background:#f3f3f1;color:#111;border-color:#f3f3f1}
button.ghost{background:transparent}
#ring{top:14px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;padding:8px 16px 8px 10px}
#ring svg{width:64px;height:64px}#ring path{fill:none;stroke:rgba(255,255,255,.22);stroke-width:5;stroke-linecap:round}#ring path.on{stroke:#fff}
#ringN{font-size:24px;font-weight:300}#ring .t1{font-size:11px;color:var(--mu);letter-spacing:.6px}#ringSub{font-size:13px;font-weight:500}#sessT{font-size:11px;color:var(--mu)}
#rec{top:104px;left:50%;transform:translate(-50%,-8px);width:min(600px,60vw);padding:12px 18px 14px;text-align:center;opacity:0;transition:.4s}
#rec.on{opacity:1;transform:translate(-50%,0)}
#recT{font-size:11px;letter-spacing:.8px;color:var(--mu);text-transform:uppercase}
#recA{font-family:"Amiri","Noto Naskh Arabic",serif;font-size:26px;direction:rtl;line-height:1.8;margin:4px 0 2px}
#recL{font-size:12px;font-style:italic;color:#d6d6d2}#recTr{font-size:13px;margin-top:4px}#recN{font-size:11px;color:var(--mu);margin-top:4px}
#act{bottom:22px;left:50%;transform:translateX(-50%);pointer-events:auto;display:flex;flex-direction:column;align-items:center;gap:8px;width:max-content;max-width:96vw}
#act .btns{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;position:relative}
#actBtn{font-size:16px;padding:12px 30px;min-width:180px}
#autoBtn{font-size:14px;padding:12px 18px}
#autoMenu{position:absolute;bottom:56px;left:0;display:none;flex-direction:column;gap:6px;padding:10px;min-width:200px}
#autoMenu.on{display:flex}#autoMenu .spd{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--mu)}#autoMenu .spd button{padding:5px 10px;font-size:12px}
#hint{font-size:11px;color:var(--mu);text-shadow:0 1px 3px #000}
#prog{font-size:14px;text-shadow:0 1px 4px #000;min-height:18px}
#sched{bottom:22px;inset-inline-start:14px;display:flex;flex-direction:column;gap:4px;padding:8px 10px}
.chip{display:flex;justify-content:space-between;gap:16px;min-width:150px;font-size:12px;padding:3px 6px;border-radius:6px;color:var(--mu)}
.chip b{font-weight:400;font-variant-numeric:tabular-nums}.chip.on{background:#f3f3f1;color:#111}.chip.ok span::after{content:" ✓"}
#labels{position:fixed;inset:0;z-index:4;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;white-space:nowrap;font-size:11px;padding:3px 9px;border-radius:999px;background:rgba(14,14,14,.66);border:1px solid rgba(255,255,255,.3);color:#f3f3f1;margin-top:-12px}
.lbl::after{content:"";position:absolute;left:50%;top:100%;width:1px;height:10px;background:rgba(255,255,255,.55)}
.lbl:hover{background:#f3f3f1;color:#111}
#joy{position:fixed;z-index:4;width:92px;height:92px;margin:-46px 0 0 -46px;border:1px solid rgba(255,255,255,.6);border-radius:50%;display:none;pointer-events:none}
#joyK{position:absolute;left:50%;top:50%;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.85);transform:translate(-50%,-50%)}
#toast{position:fixed;z-index:30;bottom:132px;left:50%;transform:translate(-50%,-6px);background:rgba(16,16,16,.78);border:1px solid var(--bd);border-radius:10px;padding:9px 18px;font-size:13px;opacity:0;transition:.3s;pointer-events:none;max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#pop{position:fixed;z-index:29;top:40%;left:50%;font-family:"Noto Serif KR",serif;font-size:58px;font-weight:500;pointer-events:none;opacity:0;color:#fff;text-shadow:0 2px 18px rgba(0,0,0,.45);transform:translate(-50%,-50%)}
#pop.go{animation:pop 2s ease forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-40%)}15%{opacity:1;transform:translate(-50%,-50%)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-62%)}}
.ov{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.5);padding:14px}
.ov.on{display:flex}
#login{background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.55))}
.card{width:min(520px,100%);max-height:92vh;overflow:auto;background:rgba(18,18,18,.92);border:1px solid var(--bd);border-radius:16px;padding:24px}
.card h2{font-family:"Noto Serif KR",serif;font-weight:500;font-size:20px;margin-bottom:8px}
.card p.sub{font-size:13px;color:var(--mu);margin-bottom:14px;line-height:1.6}
label{display:block;font-size:12px;color:var(--mu);margin:14px 0 6px;letter-spacing:.3px}
input[type=text],select{width:100%;font:inherit;font-size:15px;color:var(--tx);background:#0c0c0c;border:1px solid var(--bd);border-radius:10px;padding:10px 12px}
input[type=range]{width:100%;accent-color:#ddd}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.seg.two{grid-template-columns:repeat(2,1fr)}#jBody .seg{grid-template-columns:repeat(3,1fr);margin:12px 0}
.seg button{padding:8px 4px;font-size:13px}
.row{display:flex;gap:8px;margin-top:20px}.row button{flex:1;padding:11px;font-size:15px}
.rug{display:flex;align-items:center;gap:12px;padding:10px;border:1px solid var(--bd);border-radius:12px;margin-bottom:8px}
.rug canvas{position:static;width:40px;height:64px;flex:none;border-radius:3px}
.rug .m{flex:1;min-width:0}.rug .n{font-size:15px}.rug .d{font-size:12px;color:var(--mu);margin-top:2px}.rug .p{font-size:13px;margin-top:3px}
.note{font-size:11px;color:var(--mu);margin-top:10px;line-height:1.6}
#logo{text-align:center;margin:2px 0 8px}#logo .t{font-family:"Noto Serif KR",serif;font-size:34px;font-weight:500;letter-spacing:2px}
#logo .ln{width:42px;height:1px;background:#fff;margin:10px auto;opacity:.6}
#logoS{text-align:center;font-size:13px;color:var(--mu);margin-bottom:6px}
#part .card,#guide .card{width:min(440px,100%)}#pD,#ccwB,#audN{font-size:14px;line-height:1.75;color:#dcdcd8}#audN{font-size:12px;color:var(--mu);margin-top:12px}
.jtop{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px;padding:10px 0;border-bottom:1px solid var(--bd)}.jtop .jk{color:var(--mu)}.jtop .big{font-size:16px}
.jlist{display:flex;flex-direction:column;gap:8px}.jit{border:1px solid var(--bd);border-radius:12px;padding:12px}.jit h4{font-weight:500;font-size:14px;margin-bottom:4px}.jit p,.jp{font-size:13px;line-height:1.7;color:#d6d6d2}
.jit button{margin-top:10px;font-size:12px;padding:6px 12px}.jit.game{border-color:rgba(255,255,255,.45)}.jp{padding:4px 2px}
#rep .card{text-align:center}#rep svg{width:100%;max-width:360px;height:auto;margin:4px auto 6px;display:block}
#timer{font-size:40px;font-weight:300;font-variant-numeric:tabular-nums}
#verses{margin:12px 0}#verses .v{padding:6px 4px;opacity:.35;transition:opacity .6s}#verses .v.on{opacity:1}
#verses .a{font-family:"Amiri",serif;font-size:22px;direction:rtl;line-height:1.9}#verses .t{font-size:12px;color:var(--mu);margin-top:2px}
@media(max-width:760px){#sched{display:none}#info{min-width:0;font-size:11px;padding:9px 10px}#clock{font-size:22px}#top{gap:4px;max-width:52vw}#top button{padding:6px 8px;font-size:11px}#hint{display:none}
 #ring{top:auto;bottom:80px;padding:4px 10px 4px 4px}#ring svg{width:40px;height:40px}#ringN{font-size:16px}#ringSub{font-size:11px}#rec{top:auto;bottom:140px;width:92vw;padding:7px 12px}#recA{font-size:18px;line-height:1.6}#recL,#recN{display:none}#recTr{font-size:12px}#toast{bottom:auto;top:180px}#actBtn{font-size:14px;min-width:140px;padding:11px 18px}#autoBtn{font-size:12px;padding:11px 12px}#pop{font-size:44px}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="labels"></div>
<div id="info" class="hud panel">
  <div id="clock">--:--</div><div id="cityLbl"></div>
  <div class="row1"><span data-i="now"></span> · <span id="curP"></span></div>
  <div id="nextP"></div>
  <div id="wudu" class="stat"></div>
</div>
<div id="ring" class="hud panel">
  <svg viewBox="0 0 80 80"><g id="ringSeg"></g><text></text></svg>
  <div><div class="t1"><span data-i="laps"></span> <b id="ringN">0</b> / 7</div><div id="ringSub"></div><div id="sessT"></div></div>
</div>
<div id="top" class="hud">
  <button id="bJour" data-i="journey"></button><button id="bGuide" data-i="guide"></button><button id="bLbl" data-i="labels"></button><button id="bSnd" data-i="sound"></button>
  <button id="bShop" data-i="shop"></button><button id="bRep" data-i="repent"></button><button id="bSet" data-i="settings"></button>
</div>
<div id="sched" class="hud panel"></div>
<div id="rec" class="hud panel"><div id="recT"></div><div id="recA"></div><div id="recL"></div><div id="recTr"></div><div id="recN"></div></div>
<div id="joy"><div id="joyK"></div></div>
<div id="act" class="hud">
  <div id="prog"></div>
  <div class="btns">
    <div id="autoMenu" class="panel"><button data-n="1" data-i="auto1"></button><button data-n="7" data-i="auto7"></button>
      <div class="spd"><span data-i="speed"></span><button data-s="1" class="sel">×1</button><button data-s="2">×2</button><button data-s="4">×4</button></div></div>
    <button id="autoBtn"></button><button id="actBtn" class="primary"></button>
  </div>
  <div id="hint" data-i="hint"></div>
</div>
<div id="toast"></div>
<div id="pop"></div>

<div id="login" class="ov on"><div class="card">
  <div id="logo"><div class="t" data-i="title"></div><div class="ln"></div></div>
  <div id="logoS" data-i="sub"></div>
  <label>Language · 언어 · اللغة · 语言</label>
  <div class="seg" id="langSeg"><button data-l="ko">한국어</button><button data-l="en">English</button><button data-l="ar">العربية</button><button data-l="zh">中文</button></div>
  <label data-i="nick"></label><input type="text" id="nick" maxlength="12">
  <label data-i="char"></label>
  <div class="seg two" id="charSeg"><button data-c="m" data-i="male"></button><button data-c="f" data-i="female"></button></div>
  <label data-i="city"></label><select id="citySel"></select>
  <div class="row"><button class="primary" id="enter" data-i="enter"></button></div>
</div></div>
<div id="part" class="ov"><div class="card"><h2 id="pT"></h2><p id="pD"></p><div class="row"><button data-close data-i="close"></button></div></div></div>
<div id="guide" class="ov"><div class="card"><h2 id="ccwT"></h2><p id="ccwB"></p><p id="audN"></p><div class="row"><button data-close class="primary" data-i="ccwOk"></button></div></div></div>
<div id="journey" class="ov"><div class="card" style="width:min(560px,100%)"><h2 data-i="jTitle"></h2><div id="jBody"></div><div class="row"><button data-close data-i="close"></button></div></div></div>
<!-- 상점 -->
<div id="shop" class="ov"><div class="card">
  <h2 data-i="shopT"></h2><p class="sub" data-i="shopS"></p>
  <div id="rugs"></div>
  <p class="note" data-i="demo"></p>
  <div class="row"><button data-close data-i="close"></button></div>
</div></div>

<!-- 결제 확인 -->
<div id="pay" class="ov" style="z-index:25"><div class="card" style="width:min(400px,100%)">
  <h2 data-i="payT"></h2><p class="sub" id="payMsg"></p>
  <p class="note" data-i="demo"></p>
  <div class="row"><button data-close data-i="cancel"></button><button class="primary" id="payOk" data-i="pay"></button></div>
</div></div>

<!-- 설정 -->
<div id="set" class="ov"><div class="card">
  <h2 data-i="settings"></h2>
  <label>Language</label>
  <div class="seg" id="langSeg2">
    <button data-l="ko">한국어</button><button data-l="en">English</button><button data-l="ar">العربية</button><button data-l="zh">中文</button>
  </div>
  <label data-i="city"></label><select id="citySel2"></select>
  <label><span data-i="preview"></span> <span id="pvLbl"></span></label>
  <input type="range" id="pv" min="0" max="24" step="0.25" value="0">
  <p class="note" data-i="pvNote"></p>
  <div class="row"><button data-close data-i="close"></button></div>
</div></div>

<!-- 회개 -->
<div id="rep" class="ov"><div class="card">
  <h2 data-i="repT"></h2>
  <svg viewBox="0 0 380 190" aria-hidden="true">
    <defs><radialGradient id="g1" cx="50%" cy="0%" r="90%"><stop offset="0" stop-color="#e8e6e0" stop-opacity=".55"/><stop offset="1" stop-color="#e8e6e0" stop-opacity="0"/></radialGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0c0c0e"/><stop offset="1" stop-color="#2a2a2e"/></linearGradient></defs>
    <rect width="380" height="190" rx="12" fill="url(#g2)"/>
    <g fill="#fff"><circle cx="40" cy="30" r="1.2"/><circle cx="90" cy="60" r="1"/><circle cx="130" cy="22" r="1.3"/><circle cx="250" cy="40" r="1"/><circle cx="330" cy="70" r="1.2"/><circle cx="300" cy="20" r="1"/><circle cx="60" cy="90" r=".9"/><circle cx="350" cy="110" r="1"/></g>
    <path d="M300 30a22 22 0 1 0 14 38a18 18 0 1 1-14-38z" fill="#e8e6e0"/>
    <path d="M190 0L60 190H320Z" fill="url(#g1)"/>
    <path d="M0 165h380v25H0z" fill="#1a1a1c"/>
    <rect x="150" y="160" width="80" height="9" rx="2" fill="#4a4a4e" stroke="#cfcfca"/>
    <g fill="#f3f3f1"><circle cx="190" cy="104" r="9"/><path d="M176 162c0-26 4-44 14-44s14 18 14 44z"/>
    <path d="M180 126l-18-20-4 4 16 24zM200 126l18-20 4 4-16 24z"/></g>
  </svg>
  <div id="timer">60:00</div>
  <p class="sub" data-i="repS" style="margin-top:6px"></p>
  <div id="verses"></div>
  <p class="note" id="audNote"></p>
  <div class="row"><button data-close data-i="close"></button></div>
</div></div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
/* ===== 운영 설정 ===== */
const CONFIG={RECITATION_URL:''/* 실서버 배포 시 라이선스 확보한 낭송 음원 URL(같은 도메인) */,ZONE_AUDIO:{start:'',yemeni:'',free:'',maqam:''}/* 구간별 낭송 음원 (예: 'audio/yemeni.mp3') */,REPENT_PRICE:100000,REPENT_MS:3600e3,RUG_MS:864e5};

/* ===== 다국어 ===== */

/* ===== 태양 계산 ===== */
const R=Math.PI/180,n180=x=>((x+180)%360+360)%360-180;
function solar(ms){const d=ms/864e5-10957.5,g=R*(357.529+.98560028*d),q=280.459+.98564736*d,l=R*(q+1.915*Math.sin(g)+.02*Math.sin(2*g)),e=R*(23.439-3.6e-7*d);
 const ra=Math.atan2(Math.cos(e)*Math.sin(l),Math.cos(l))/R,dec=Math.asin(Math.sin(e)*Math.sin(l));
 return{ra,dec,eqt:n180(q-ra)/15,gmst:(18.697374558+24.06570982441908*d)*15}}
function sunAt(ms,c){const s=solar(ms),ha=n180(s.gmst+c[2]-s.ra),la=c[1]*R,h=ha*R;
 const alt=Math.asin(Math.sin(la)*Math.sin(s.dec)+Math.cos(la)*Math.cos(s.dec)*Math.cos(h));
 const az=Math.atan2(-Math.sin(h),Math.tan(s.dec)*Math.cos(la)-Math.sin(la)*Math.cos(h));
 return{alt:alt/R,az,ha}}
function prayerTimes(ms,c){const tz=c[3],lo=new Date(ms+tz*36e5),base=Date.UTC(lo.getUTCFullYear(),lo.getUTCMonth(),lo.getUTCDate())-tz*36e5;
 const s=solar(base+12*36e5),la=c[1]*R,noon=12+tz-c[2]/15-s.eqt;
 const H=a=>Math.acos(Math.max(-1,Math.min(1,(Math.sin(a)-Math.sin(la)*Math.sin(s.dec))/(Math.cos(la)*Math.cos(s.dec)))))/R/15;
 const asr=Math.atan(1/(1+Math.tan(Math.abs(la-s.dec)))),t=h=>base+h*36e5;
 return{key:lo.toISOString().slice(0,10),base,fajr:t(noon-H(-18*R)),sunrise:t(noon-H(-.833*R)),dhuhr:t(noon+.03),asr:t(noon+H(asr)),maghrib:t(noon+H(-.833*R)),isha:t(noon+H(-17*R))}}
function current(ms){const c=city(),p=prayerTimes(ms,c);let cur=null,key=p.key,next,nextT;
 if(ms<p.fajr){cur='isha';key=prayerTimes(ms-864e5,c).key;next='fajr';nextT=p.fajr}
 else if(ms<p.sunrise){cur='fajr';next='dhuhr';nextT=p.dhuhr}
 else if(ms<p.dhuhr){next='dhuhr';nextT=p.dhuhr}
 else if(ms<p.asr){cur='dhuhr';next='asr';nextT=p.asr}
 else if(ms<p.maghrib){cur='asr';next='maghrib';nextT=p.maghrib}
 else if(ms<p.isha){cur='maghrib';next='isha';nextT=p.isha}
 else{cur='isha';next='fajr';nextT=prayerTimes(ms+864e5,c).fajr}
 return{cur,key,next,nextT}}

 const vis=[];for(const l of LBE){l.d=cam.position.distanceTo(l.v);_p.copy(l.v).project(cam);l.ok=_p.z<1&&Math.abs(_p.x)<1.02&&Math.abs(_p.y)<1.02&&l.d<(l.far?5200:760);l.sx=(_p.x+1)/2*W;l.sy=(1-_p.y)/2*H;if(l.ok)vis.push(l);else l.e.style.display='none'}
 vis.sort((a,b)=>a.d-b.d);for(const l of vis){if(!l.w){l.e.style.display='';l.w=l.e.offsetWidth||90}const w=l.w+6,h=24;let y=l.sy,okp=false;
  for(let k=0;k<4&&!okp;k++){okp=!placed.some(p=>Math.abs(p.x-l.sx)<(p.w+w)/2&&Math.abs(p.y-y)<h);if(!okp)y-=h}
  if(!okp||y<104){l.e.style.display='none';continue}placed.push({x:l.sx,y,w});l.e.style.display='';l.e.style.transform=`translate(${l.sx.toFixed(1)}px,${y.toFixed(1)}px) translate(-50%,-100%)`;l.e.style.opacity=Math.max(.45,Math.min(1,1.3-l.d/(l.far?5200:760)))}}
function showPart(id){$('pT').textContent=L.parts[id][0];$('pD').textContent=L.parts[id][1];open('part')}

/* ===== 순례 일정 (히즈라력 · 하지) ===== */
const HJ=d=>{try{const o={};new Intl.DateTimeFormat('en-u-ca-islamic-umalqura-nu-latn',{day:'numeric',month:'numeric',year:'numeric'}).formatToParts(d).forEach(x=>o[x.type]=x.value);return{d:+o.day,m:+o.month,y:parseInt(o.year)}}catch(e){return null}};
const hjText=d=>{try{return new Intl.DateTimeFormat((S.lang==='zh'?'zh-CN':S.lang)+'-u-ca-islamic-umalqura',{day:'numeric',month:'long',year:'numeric'}).format(d)}catch(e){return''}};
function hajjInfo(){const t=new Date(now()),h=HJ(t);if(!h)return null;let days=null;for(let i=0;i<400;i++){const x=HJ(new Date(t.getTime()+i*864e5));if(x&&x.m===12&&x.d===8){days=i;break}}return{h,inHajj:h.m===12&&h.d>=8&&h.d<=13,season:h.m===12&&h.d<=13,days}}
let jTab=0;
function buildJourney(){const hi=hajjInfo(),box=$('jBody');box.textContent='';
 const top=el('div','jtop');top.append(el('div','jk',L.jToday),el('div','jv',hjText(new Date(now()))));
 if(hi){top.append(el('div','jk',hi.inHajj?'':L.jNext),el('div','jv big',hi.inHajj?L.jHajjNow:hi.days!==null?fmt(L.jDays,{n:hi.days}):'—'))}box.append(top);
 const tabs=el('div','seg');L.jTabs.forEach((t,i)=>{const b=el('button',i===jTab?'sel':'',t);b.onclick=()=>{jTab=i;buildJourney()};tabs.append(b)});box.append(tabs);
 const list=el('div','jlist');const go=kind=>{S.tawafKind=kind;save();close('journey');refreshRing();toast(L.kinds[kind])};
 if(jTab===0){L.jDaily.forEach((s,i)=>{const it=el('div','jit');it.append(el('p','',s));if(i===1){const b=el('button','',L.jInGame+' · '+L.kinds.umrah);b.onclick=()=>go('umrah');it.append(b)}else{const b=el('button','',L.jInGame+' · '+L.kinds.nafl);b.onclick=()=>go('nafl');it.append(b)}list.append(it)})}
 else if(jTab===1){L.jHajj.forEach(([h,d,g],i)=>{const it=el('div','jit'+(g?' game':''));it.append(el('h4','',h),el('p','',d));if(g){const b=el('button','',L.jInGame+' · '+(i===3?L.kinds.ifadah:L.kinds.wada));b.onclick=()=>go(i===3?'ifadah':'wada');it.append(b)}list.append(it)})}
 else L.jMadinah.forEach(s=>list.append(el('p','jp',s)));
 box.append(list)}
function refreshTexts(){buildLabels();refreshRing();refreshRec();$('ccwT').textContent=L.ccwT;$('ccwB').textContent=L.ccwB;$('audN').textContent=L.audioNote;
 $('bLbl').classList.toggle('sel',!!S.labels);$('bSnd').classList.toggle('sel',!!S.sound);if($('journey').classList.contains('on'))buildJourney()}
$('actBtn').onclick=()=>{auCtx();if(pray){pray=null;hud();return}if(washT>0)return;
 if(TW.phase==='maqam'){startMaqam();return}
 if(!wuOk()&&nearF()){auto=null;washT=1.3;$('prog').textContent='…';return}startPrayer()};
$('autoBtn').onclick=()=>{auCtx();if(pray||washT>0)return;if(auto){auto=null;hud();return}
 if(TW.phase==='maqam'){auto={mode:'goto'};hud();return}
 if(!wuOk()){toast(L.needWudu);return}$('autoMenu').classList.toggle('on')};
document.querySelectorAll('#autoMenu [data-n]').forEach(b=>b.onclick=()=>{const spd=+(document.querySelector('#autoMenu .spd .sel')||{dataset:{s:1}}).dataset.s;
 const r=Math.hypot(P.x-CX,P.y-CY),a=Math.atan2(P.y-CY,P.x-CX);auto={mode:'laps',target:Math.min(7,(TW.started?TW.laps:0)+(+b.dataset.n)),spd,off:Math.max(18,Math.min(200,r-extAt(a)))};$('autoMenu').classList.remove('on');hud()});
document.querySelectorAll('#autoMenu [data-s]').forEach(b=>b.onclick=()=>{document.querySelectorAll('#autoMenu [data-s]').forEach(x=>x.classList.toggle('sel',x===b))});
$('bJour').onclick=()=>{buildJourney();open('journey')};
$('bGuide').onclick=()=>open('guide');
$('bLbl').onclick=()=>{S.labels=!S.labels;save();refreshTexts()};
$('bSnd').onclick=()=>{S.sound=!S.sound;save();if(S.sound){auCtx();chime('zone')}zoneAudio(S.sound?zone:null);refreshTexts()};
let toastT;function toast(m){const e=$('toast');e.textContent=m;e.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('on'),3200)}
function pop(txt){const e=$('pop');e.textContent=txt;e.classList.remove('go');void e.offsetWidth;e.classList.add('go')}
{const hi=hajjInfo();if(hi&&hi.season)kRaise.visible=true}

/* ===== 상점 / 결제 ===== */
const open=id=>$(id).classList.add('on'),close=id=>$(id).classList.remove('on');
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>{const o=b.closest('.ov');o.classList.remove('on');if(o.id==='rep')stopAudio()});
function buildShop(){const box=$('rugs');box.innerHTML='';RUGS.forEach((r,i)=>{const exp=S.rugs[r.id]||0,own=r.price===0||exp>Date.now(),el=document.createElement('div');el.className='rug';
 const c=document.createElement('canvas');c.width=88;c.height=140;const g=c.getContext('2d');g.translate(44,70);g.scale(2.6,2.6);rugArt(g,r,26,44,0);
 const m=document.createElement('div');m.className='m';const rem=Math.max(0,exp-Date.now());
 m.innerHTML=`<div class="n"></div><div class="d"></div><div class="p"></div>`;m.children[0].textContent=L.rugs[i][0];m.children[1].textContent=L.rugs[i][1];
 m.children[2].textContent=r.price===0?L.free:own?fmt(L.left,{h:Math.floor(rem/36e5),m:Math.floor(rem%36e5/6e4)}):won(r.price)+' / 24h';
 const b=document.createElement('button');
 if(own){const use=S.rug===r.id;b.textContent=use?L.inUse:L.use;if(use)b.className='ghost';b.onclick=()=>{S.rug=r.id;save();buildShop()}}
 else{b.className='gold';b.textContent=L.buy;b.onclick=()=>askPay(L.rugs[i][0],r.price,()=>{S.rugs[r.id]=Date.now()+CONFIG.RUG_MS;S.rug=r.id;save();buildShop();toast(fmt(L.bought,{n:L.rugs[i][0]}))})}
 el.append(c,m,b);box.append(el)})}
let payCb=null;function askPay(n,p,cb){$('payMsg').textContent=fmt(L.payMsg,{n,p:won(p)});$('payMsg').style.whiteSpace='pre-line';payCb=cb;open('pay')}
/* 실결제 연동 지점: 여기서 PG(토스페이먼츠 등) 결제창 호출 → 서버 검증 후 payCb 실행 */
$('payOk').onclick=()=>{close('pay');if(payCb)payCb();payCb=null};
$('bShop').onclick=()=>{buildShop();open('shop')};
$('bSet').onclick=()=>open('set');

/* ===== 회개 ===== */
let actx=null,nodes=[],aud=null,repI=null;
function startAudio(){try{if(CONFIG.RECITATION_URL){aud=new Audio(CONFIG.RECITATION_URL);aud.loop=true;aud.play().catch(()=>{});return}
 actx=new(window.AudioContext||window.webkitAudioContext)();const master=actx.createGain();master.gain.value=0;master.gain.linearRampToValueAtTime(.05,actx.currentTime+4);master.connect(actx.destination);
 for(const f of[110,164.81,220,329.63]){const o=actx.createOscillator(),g=actx.createGain(),l=actx.createOscillator(),lg=actx.createGain();o.type='sine';o.frequency.value=f;l.frequency.value=.05+Math.random()*.08;lg.gain.value=.4;g.gain.value=.5;l.connect(lg);lg.connect(g.gain);o.connect(g);g.connect(master);o.start();l.start();nodes.push(o,l)}}catch(e){}}
function stopAudio(){try{if(aud){aud.pause();aud=null}nodes.forEach(n=>n.stop());nodes=[];if(actx){actx.close();actx=null}}catch(e){}clearInterval(repI)}
function openRep(){const box=$('verses');box.innerHTML='';FATIHA.forEach((v,i)=>{const d=document.createElement('div');d.className='v';const a=document.createElement('div');a.className='a';a.textContent=v;d.append(a);if(L.F[i]){const t=document.createElement('div');t.className='t';t.textContent=L.F[i];d.append(t)}box.append(d)});
 $('audNote').textContent=CONFIG.RECITATION_URL?L.audOn:L.audOff;open('rep');startAudio();
 const tick=()=>{const rem=S.repEnd-Date.now();if(rem<=0){close('rep');stopAudio();return}
  $('timer').textContent=String(Math.floor(rem/6e4)).padStart(2,'0')+':'+String(Math.floor(rem%6e4/1e3)).padStart(2,'0');
  const k=Math.floor((CONFIG.REPENT_MS-rem)/8e3)%7;[...box.children].forEach((c,i)=>c.classList.toggle('on',i===k))};tick();repI=setInterval(tick,500)}
$('bRep').onclick=()=>{if(S.repEnd>Date.now()){openRep();return}askPay(L.repBuy,CONFIG.REPENT_PRICE,()=>{S.repEnd=Date.now()+CONFIG.REPENT_MS;save();openRep()})};

/* ===== 언어 / 로그인 / 설정 ===== */
function applyLang(){L=T[S.lang];document.documentElement.lang=S.lang;document.documentElement.dir=S.lang==='ar'?'rtl':'ltr';
 document.querySelectorAll('[data-i]').forEach(e=>e.textContent=L[e.dataset.i]);
 document.querySelectorAll('[data-l]').forEach(b=>b.classList.toggle('sel',b.dataset.l===S.lang));
 document.querySelectorAll('[data-c]').forEach(b=>b.classList.toggle('sel',b.dataset.c===S.ch));
 for(const id of['citySel','citySel2']){const s=$(id);s.innerHTML='';CITIES.forEach(c=>{const o=document.createElement('option');o.value=c[0];o.textContent=c[4][S.lang];s.append(o)});s.value=S.city}
 $('pvLbl').textContent='+'+pvOff+'h';refreshTexts();hud()}
document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{S.lang=b.dataset.l;save();applyLang()});
document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{S.ch=b.dataset.c;buildHero();applyLang()});
for(const id of['citySel','citySel2'])$(id).onchange=e=>{S.city=e.target.value;save();applySun();applyLang()};
$('pv').oninput=e=>{pvOff=+e.target.value;$('pvLbl').textContent='+'+pvOff+'h';applySun();hud()};
$('nick').value=S.name;
$('enter').onclick=()=>{auCtx();setTimeout(refreshRec,50);S.name=$('nick').value.trim().slice(0,12)||'Guest';save();setTag();close('login')};
applyLang();

/* ===== 루프 ===== */
let last=performance.now(),slow=0,clk=0;const loginEl=$('login');
function frame(t){const dt=Math.min(.1,(t-last)/1e3);last=t;slow+=dt;clk+=dt;const intro=loginEl.classList.contains('on');
 if(slow>.5){slow=0;applySun();hud()}if(clk>20){clk=0;drawClock()}
 if(!intro)update(dt,t);else{crowdStep(dt,t);fxStep(dt)}sync(dt,t,intro);rnd.render(scene,cam);requestAnimationFrame(frame)}
applySun();setTag();refreshTexts();cam.position.set(CX+1200,700,CY+900);requestAnimationFrame(frame);
</script>
