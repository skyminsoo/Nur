<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>누르 온라인 — 빛의 순례</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#0b1026;color:#f4efe1;font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR","PingFang SC","Microsoft YaHei","Segoe UI",Tahoma,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:fixed;z-index:5;pointer-events:none}
.panel{background:rgba(10,36,34,.78);border:1px solid rgba(214,178,94,.55);border-radius:12px;padding:10px 14px;backdrop-filter:blur(6px)}
#info{top:12px;inset-inline-start:12px;min-width:190px;font-size:13px;line-height:1.55}
#info b{color:#e9c877;font-size:15px}
#clock{font-size:22px;font-weight:700;letter-spacing:.5px;font-variant-numeric:tabular-nums}
#top{top:12px;inset-inline-end:12px;display:flex;gap:8px;pointer-events:auto}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid rgba(214,178,94,.6);background:rgba(10,36,34,.82);border-radius:10px;padding:9px 13px;font-size:13px;transition:transform .08s,background .15s}
button:hover{background:rgba(22,70,64,.92)}button:active{transform:scale(.96)}
button.gold{background:linear-gradient(180deg,#e9c877,#b8893a);color:#1c1505;border-color:#f6e2a8;font-weight:700}
button.ghost{background:transparent}
#act{bottom:26px;left:50%;transform:translateX(-50%);pointer-events:auto;display:flex;flex-direction:column;align-items:center;gap:8px}
#actBtn{font-size:16px;padding:13px 34px;border-radius:999px}
#hint{font-size:11px;opacity:.75;text-shadow:0 1px 3px #000}
#prog{font-size:13px;text-shadow:0 1px 4px #000;min-height:18px}
#toast{position:fixed;z-index:30;top:22%;left:50%;transform:translateX(-50%);background:rgba(8,28,26,.92);border:1px solid #d6b25e;border-radius:999px;padding:10px 22px;font-size:14px;opacity:0;transition:opacity .35s;pointer-events:none;max-width:88vw;text-align:center}
.ov{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(4,8,20,.72);padding:14px}
.ov.on{display:flex}
.card{width:min(560px,100%);max-height:92vh;overflow:auto;background:linear-gradient(180deg,#0f3a36,#0a2422);border:1px solid #d6b25e;border-radius:16px;padding:22px}
.card h2{color:#e9c877;font-size:20px;margin-bottom:6px}
.card p.sub{font-size:13px;opacity:.8;margin-bottom:16px;line-height:1.5}
label{display:block;font-size:12px;opacity:.8;margin:12px 0 6px}
input[type=text],select{width:100%;font:inherit;color:#f4efe1;background:#06201e;border:1px solid rgba(214,178,94,.5);border-radius:8px;padding:10px}
input[type=range]{width:100%}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.seg.two{grid-template-columns:repeat(2,1fr)}
.seg button.sel{background:#e9c877;color:#1c1505;font-weight:700}
.row{display:flex;gap:8px;margin-top:18px}.row button{flex:1}
.rug{display:flex;align-items:center;gap:12px;padding:10px;border:1px solid rgba(214,178,94,.3);border-radius:12px;margin-bottom:8px}
.rug canvas{position:static;width:44px;height:70px;flex:none;border-radius:4px}
.rug .m{flex:1;min-width:0}.rug .n{font-weight:700}.rug .d{font-size:12px;opacity:.75;margin-top:2px}
.rug .p{color:#e9c877;font-weight:700;font-size:13px;margin-top:3px}
.note{font-size:11px;opacity:.65;margin-top:10px;line-height:1.5}
#logo{font-size:30px;color:#e9c877;font-weight:800;text-align:center}
#logoS{text-align:center;font-size:13px;opacity:.8;margin:4px 0 10px}
#rep .card{width:min(620px,100%);text-align:center;background:linear-gradient(180deg,#0a1230,#06201e)}
#rep svg{width:100%;max-width:380px;height:auto;margin:4px auto 6px;display:block}
#timer{font-size:34px;font-weight:700;color:#e9c877;font-variant-numeric:tabular-nums}
#verses{margin:12px 0;text-align:center}
#verses .v{padding:7px 4px;opacity:.38;transition:opacity .6s}
#verses .v.on{opacity:1}
#verses .a{font-family:"Amiri","Traditional Arabic","Geeza Pro","Noto Naskh Arabic",serif;font-size:22px;direction:rtl;line-height:1.9}
#verses .t{font-size:12px;opacity:.85;margin-top:2px}
@media(max-width:560px){#info{font-size:12px;min-width:150px}#clock{font-size:18px}#top button{padding:8px 9px;font-size:12px}#hint{display:none}}

.panel{box-shadow:0 8px 24px rgba(0,0,0,.35),inset 0 0 0 3px rgba(214,178,94,.12)}
#info{border-radius:16px 16px 16px 4px}
#act .btns{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
#autoBtn{border-radius:999px;padding:12px 20px;font-size:14px}
#actBtn,#autoBtn{box-shadow:0 6px 18px rgba(0,0,0,.35)}
#sched{bottom:26px;inset-inline-start:12px;display:flex;flex-direction:column;gap:5px}
.chip{display:flex;justify-content:space-between;gap:14px;min-width:150px;font-size:12px;padding:5px 11px;border-radius:999px;background:rgba(10,36,34,.62);border:1px solid rgba(214,178,94,.28);backdrop-filter:blur(4px)}
.chip b{font-variant-numeric:tabular-nums;font-weight:600}
.chip.on{background:linear-gradient(90deg,#e9c877,#b8893a);color:#1c1505;border-color:#f6e2a8;font-weight:700}
.chip.ok span::after{content:" ✓";color:#7fe0a8}.chip.on.ok span::after{color:#0d5c3a}
#joy{position:fixed;z-index:4;width:92px;height:92px;margin:-46px 0 0 -46px;border:2px solid rgba(255,255,255,.5);border-radius:50%;display:none;pointer-events:none}
#joyK{position:absolute;left:50%;top:50%;width:34px;height:34px;border-radius:50%;background:rgba(233,200,119,.85);transform:translate(-50%,-50%)}
@media(max-width:700px){#sched{display:none}}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="info" class="hud panel">
  <div id="clock">--:--</div>
  <div id="cityLbl"></div>
  <div><span data-i="now"></span>: <b id="curP"></b></div>
  <div id="nextP"></div>
  <div id="tawaf"></div>
  <div id="wudu"></div>
</div>
<div id="top" class="hud">
  <button id="bShop" data-i="shop"></button>
  <button id="bRep" class="gold" data-i="repent"></button>
  <button id="bSet" data-i="settings"></button>
</div>
<div id="sched" class="hud"></div>
<div id="joy"><div id="joyK"></div></div>
<div id="act" class="hud">
  <div id="prog"></div>
  <div class="btns"><button id="autoBtn"></button><button id="actBtn" class="gold"></button></div>
  <div id="hint" data-i="hint"></div>
</div>
<div id="toast"></div>

<!-- 로그인 -->
<div id="login" class="ov on"><div class="card">
  <div id="logo">☪ Noor Online</div>
  <div id="logoS" data-i="sub"></div>
  <label>Language · 언어 · اللغة · 语言</label>
  <div class="seg" id="langSeg">
    <button data-l="ko">한국어</button><button data-l="en">English</button><button data-l="ar">العربية</button><button data-l="zh">中文</button>
  </div>
  <label data-i="nick"></label><input type="text" id="nick" maxlength="12">
  <label data-i="char"></label>
  <div class="seg two" id="charSeg"><button data-c="m" data-i="male"></button><button data-c="f" data-i="female"></button></div>
  <label data-i="city"></label><select id="citySel"></select>
  <div class="row"><button class="gold" id="enter" data-i="enter"></button></div>
</div></div>

<!-- 상점 -->
<div id="shop" class="ov"><div class="card">
  <h2 data-i="shopT"></h2><p class="sub" data-i="shopS"></p>
  <div id="rugs"></div>
  <p class="note" data-i="demo"></p>
  <div class="row"><button data-close data-i="close"></button></div>
</div></div>

<!-- 결제 확인 -->
<div id="pay" class="ov" style="z-index:25"><div class="card" style="width:min(400px,100%)">
  <h2 data-i="payT"></h2><p class="sub" id="payMsg"></p>
  <p class="note" data-i="demo"></p>
  <div class="row"><button data-close data-i="cancel"></button><button class="gold" id="payOk" data-i="pay"></button></div>
</div></div>

<!-- 설정 -->
<div id="set" class="ov"><div class="card">
  <h2 data-i="settings"></h2>
  <label>Language</label>
  <div class="seg" id="langSeg2">
    <button data-l="ko">한국어</button><button data-l="en">English</button><button data-l="ar">العربية</button><button data-l="zh">中文</button>
  </div>
  <label data-i="city"></label><select id="citySel2"></select>
  <label><span data-i="preview"></span> <span id="pvLbl"></span></label>
  <input type="range" id="pv" min="0" max="24" step="0.25" value="0">
  <p class="note" data-i="pvNote"></p>
  <div class="row"><button data-close data-i="close"></button></div>
</div></div>

<!-- 회개 -->
<div id="rep" class="ov"><div class="card">
  <h2 data-i="repT"></h2>
  <svg viewBox="0 0 380 190" aria-hidden="true">
    <defs><radialGradient id="g1" cx="50%" cy="0%" r="90%"><stop offset="0" stop-color="#f6e2a8" stop-opacity=".55"/><stop offset="1" stop-color="#f6e2a8" stop-opacity="0"/></radialGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#070b24"/><stop offset="1" stop-color="#17305a"/></linearGradient></defs>

    <g fill="#fff"><circle cx="40" cy="30" r="1.2"/><circle cx="90" cy="60" r="1"/><circle cx="130" cy="22" r="1.3"/><circle cx="250" cy="40" r="1"/><circle cx="330" cy="70" r="1.2"/><circle cx="300" cy="20" r="1"/><circle cx="60" cy="90" r=".9"/><circle cx="350" cy="110" r="1"/></g>
    <path d="M300 30a22 22 0 1 0 14 38a18 18 0 1 1-14-38z" fill="#f6e2a8"/>
    <path d="M190 0L60 190H320Z" fill="url(#g1)"/>
    <path d="M0 165h380v25H0z" fill="#0a2422"/>
    <rect x="150" y="160" width="80" height="9" rx="2" fill="#8a2433" stroke="#e9c877"/>
    <g fill="#f4efe1"><circle cx="190" cy="104" r="9"/><path d="M176 162c0-26 4-44 14-44s14 18 14 44z"/>
    <path d="M180 126l-18-20-4 4 16 24zM200 126l18-20 4 4-16 24z"/></g>
  </svg>
  <div id="timer">60:00</div>
  <p class="sub" data-i="repS" style="margin-top:6px"></p>
  <div id="verses"></div>
  <p class="note" id="audNote"></p>
  <div class="row"><button data-close data-i="close"></button></div>
</div></div>

  P.x=CX+Math.cos(a)*r;P.y=CY+Math.sin(a)*r;P.face=Math.atan2(P.x-ox,P.y-oy);P.walk+=dt*.45;P.moving=1;
  if(auto.sw>=6.2832){auto=null;toast(L.autoDone);hud()}}
 else if(m>0){dx/=m;dy/=m;const mx=Math.cos(yaw)*dx+Math.sin(yaw)*dy,mz=-Math.sin(yaw)*dx+Math.cos(yaw)*dy,sp=150*dt;
  let nx=Math.max(110,Math.min(WS-110,P.x+mx*sp)),ny=Math.max(110,Math.min(WS-110,P.y+mz*sp));
  if(!hit(nx,P.y))P.x=nx;if(!hit(P.x,ny))P.y=ny;P.face=Math.atan2(mx,mz);P.walk+=dt;P.moving=1}
 const r=Math.hypot(P.x-CX,P.y-CY),a=Math.atan2(P.y-CY,P.x-CX);
 if(r>70&&r<450){if(tw.prev!==null){let da=a-tw.prev;if(da>Math.PI)da-=6.2832;if(da<-Math.PI)da+=6.2832;tw.cum+=da}
  const laps=Math.floor(Math.max(0,-tw.cum)/6.2832);
  if(laps>tw.laps){tw.laps=laps;if(laps>=7){S.tawafTotal++;save();tw.cum=0;tw.laps=0;toast(L.tawafDone)}else toast(fmt(L.lap,{n:laps}));hud()}}
 tw.prev=a}
let faceS=Math.PI;
function sync(dt,t,intro){
 const swing=P.moving?Math.sin(P.walk*9)*.55:0;pose(hero,heroPose,dt,swing);
 let df=P.face-faceS;df=Math.atan2(Math.sin(df),Math.cos(df));faceS+=df*Math.min(1,dt*10);
 hero.g.position.set(P.x,P.moving?Math.abs(Math.sin(P.walk*9))*1.3:0,P.y);hero.g.rotation.y=faceS;
 tag.position.set(P.x,14*hero.ls+34,P.y);tag.visible=!intro;
 rugM.visible=!!pray;if(!pray)rugGlow.visible=false;else if(rugGlow.visible)rugGlow.material.opacity=.14+.08*Math.sin(t/400)+.3*nightK;
 // 카메라: 항상 카바를 바라보는 3인칭 시점
 let tx=P.x,tz=P.y,d=pray?Math.min(dist,190):dist,ty=24,want;
 if(intro){tx=CX;tz=CY;d=640;ty=70;want=t/9000}else want=Math.atan2(P.x-CX,P.y-CY)+yawOff;
 let dy=want-yaw;dy=Math.atan2(Math.sin(dy),Math.cos(dy));yaw+=dy*Math.min(1,dt*(intro?5:3));
 const cx=tx+Math.sin(yaw)*d,cz=tz+Math.cos(yaw)*d,cy=ty+d*.46,k=Math.min(1,dt*6);
 cam.position.x+=(cx-cam.position.x)*k;cam.position.y+=(cy-cam.position.y)*k;cam.position.z+=(cz-cam.position.z)*k;cam.lookAt(tx,ty+12,tz);
 sky.position.copy(cam.position);stars.position.copy(cam.position);
 sunS.position.copy(cam.position).addScaledVector(sunDir,7000);
 moonS.position.set(cam.position.x-sunDir.x*5000,cam.position.y+3600,cam.position.z-sunDir.z*5000);
 sunL.target.position.set(tx,0,tz);sunL.position.set(tx+sunDir.x*1500,Math.max(.06,sunDir.y)*1500,tz+sunDir.z*1500)}
function startPrayer(){if(Math.hypot(P.x-CX,P.y-CY)<460){toast(L.noTrack);return}if(!wuOk()){toast(L.goFountain);return}auto=null;
 const c=current(now());let name=c.cur;const done=name&&(S.prayed[c.key]||{})[name];
 pray={name:(!name||done)?null:name,key:c.key,total:(!name||done)?2:RAK[name],t:0,rk:0};layRug();hud()}
function finishPrayer(){const p=pray;pray=null;if(p.name){(S.prayed[p.key]=S.prayed[p.key]||{})[p.name]=1;const ks=Object.keys(S.prayed).sort();while(ks.length>7)delete S.prayed[ks.shift()];save()}
 toast(fmt(L.prayDone,{p:p.name?L.P[p.name]:L.nafl}));hud()}
const nearF=()=>Math.hypot(P.x-FX,P.y-FY)<150;
function hud(){const ms=now();cur=current(ms);$('clock').textContent=hhmm(ms);$('cityLbl').textContent=city()[4][S.lang];
 const done=cur.cur&&(S.prayed[cur.key]||{})[cur.cur];$('curP').textContent=cur.cur?L.P[cur.cur]+(done?' ✓':''):L.none;
 $('nextP').textContent=L.next+': '+L.P[cur.next]+' '+hhmm(cur.nextT);
 $('tawaf').textContent='🕋 '+L.tawaf+' '+tw.laps+'/7'+(S.tawafTotal?' · ✦'+S.tawafTotal:'');
 const wu=wuOk(),n=S.wuduN||0;$('wudu').textContent='💧 '+(wu?L.wuduOk:L.wuduNeed+' '+n+'/3');
 const pt=prayerTimes(ms,city()),sc=$('sched');sc.textContent='';
 for(const k of ORDER){const d=document.createElement('div');d.className='chip'+(cur.cur===k?' on':'')+((S.prayed[pt.key]||{})[k]?' ok':'');const a=document.createElement('span');a.textContent=L.P[k];const b=document.createElement('b');b.textContent=hhmm(pt[k]);d.append(a,b);sc.append(d)}
 const b=$('actBtn');if(pray){b.textContent=L.stop;$('prog').textContent=fmt(L.rak,{p:pray.name?L.P[pray.name]:L.nafl,a:Math.min(pray.total,pray.rk+1),b:pray.total})}
 else{$('prog').textContent='';b.textContent=(!wu&&nearF())?'💧 '+L.doWudu+' ('+n+'/3)':'🤲 '+L.pray}
 $('autoBtn').textContent=auto?L.autoStop:'🕋 '+L.auto;$('autoBtn').style.display=pray?'none':''}
$('actBtn').onclick=()=>{if(pray){pray=null;hud();return}if(washT>0)return;
 if(!wuOk()&&nearF()){auto=null;washT=1.3;$('prog').textContent='💧 …';return}startPrayer()};
$('autoBtn').onclick=()=>{if(pray||washT>0)return;auto=auto?null:{sw:0};hud()};
let toastT;function toast(m){const e=$('toast');e.textContent=m;e.style.opacity=1;clearTimeout(toastT);toastT=setTimeout(()=>e.style.opacity=0,2600)}

/* ===== 상점 / 결제 ===== */
const open=id=>$(id).classList.add('on'),close=id=>$(id).classList.remove('on');
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>{const o=b.closest('.ov');o.classList.remove('on');if(o.id==='rep')stopAudio()});
function buildShop(){const box=$('rugs');box.innerHTML='';RUGS.forEach((r,i)=>{const exp=S.rugs[r.id]||0,own=r.price===0||exp>Date.now(),el=document.createElement('div');el.className='rug';
 const c=document.createElement('canvas');c.width=88;c.height=140;const g=c.getContext('2d');g.translate(44,70);g.scale(2.6,2.6);rugArt(g,r,26,44,0);
 const m=document.createElement('div');m.className='m';const rem=Math.max(0,exp-Date.now());
 m.innerHTML=`<div class="n"></div><div class="d"></div><div class="p"></div>`;m.children[0].textContent=L.rugs[i][0];m.children[1].textContent=L.rugs[i][1];
 m.children[2].textContent=r.price===0?L.free:own?fmt(L.left,{h:Math.floor(rem/36e5),m:Math.floor(rem%36e5/6e4)}):won(r.price)+' / 24h';
 const b=document.createElement('button');
 if(own){const use=S.rug===r.id;b.textContent=use?L.inUse:L.use;if(use)b.className='ghost';b.onclick=()=>{S.rug=r.id;save();buildShop()}}
 else{b.className='gold';b.textContent=L.buy;b.onclick=()=>askPay(L.rugs[i][0],r.price,()=>{S.rugs[r.id]=Date.now()+CONFIG.RUG_MS;S.rug=r.id;save();buildShop();toast(fmt(L.bought,{n:L.rugs[i][0]}))})}
 el.append(c,m,b);box.append(el)})}
let payCb=null;function askPay(n,p,cb){$('payMsg').textContent=fmt(L.payMsg,{n,p:won(p)});$('payMsg').style.whiteSpace='pre-line';payCb=cb;open('pay')}
/* 실결제 연동 지점: 여기서 PG(토스페이먼츠 등) 결제창 호출 → 서버 검증 후 payCb 실행 */
$('payOk').onclick=()=>{close('pay');if(payCb)payCb();payCb=null};
$('bShop').onclick=()=>{buildShop();open('shop')};
$('bSet').onclick=()=>open('set');

/* ===== 회개 ===== */
let actx=null,nodes=[],aud=null,repI=null;
function startAudio(){try{if(CONFIG.RECITATION_URL){aud=new Audio(CONFIG.RECITATION_URL);aud.loop=true;aud.play().catch(()=>{});return}
 actx=new(window.AudioContext||window.webkitAudioContext)();const master=actx.createGain();master.gain.value=0;master.gain.linearRampToValueAtTime(.05,actx.currentTime+4);master.connect(actx.destination);
 for(const f of[110,164.81,220,329.63]){const o=actx.createOscillator(),g=actx.createGain(),l=actx.createOscillator(),lg=actx.createGain();o.type='sine';o.frequency.value=f;l.frequency.value=.05+Math.random()*.08;lg.gain.value=.4;g.gain.value=.5;l.connect(lg);lg.connect(g.gain);o.connect(g);g.connect(master);o.start();l.start();nodes.push(o,l)}}catch(e){}}
function stopAudio(){try{if(aud){aud.pause();aud=null}nodes.forEach(n=>n.stop());nodes=[];if(actx){actx.close();actx=null}}catch(e){}clearInterval(repI)}
function openRep(){const box=$('verses');box.innerHTML='';FATIHA.forEach((v,i)=>{const d=document.createElement('div');d.className='v';const a=document.createElement('div');a.className='a';a.textContent=v;d.append(a);if(L.F[i]){const t=document.createElement('div');t.className='t';t.textContent=L.F[i];d.append(t)}box.append(d)});
 $('audNote').textContent=CONFIG.RECITATION_URL?L.audOn:L.audOff;open('rep');startAudio();
 const tick=()=>{const rem=S.repEnd-Date.now();if(rem<=0){close('rep');stopAudio();return}
  $('timer').textContent=String(Math.floor(rem/6e4)).padStart(2,'0')+':'+String(Math.floor(rem%6e4/1e3)).padStart(2,'0');
  const k=Math.floor((CONFIG.REPENT_MS-rem)/8e3)%7;[...box.children].forEach((c,i)=>c.classList.toggle('on',i===k))};tick();repI=setInterval(tick,500)}
$('bRep').onclick=()=>{if(S.repEnd>Date.now()){openRep();return}askPay(L.repBuy,CONFIG.REPENT_PRICE,()=>{S.repEnd=Date.now()+CONFIG.REPENT_MS;save();openRep()})};

/* ===== 언어 / 로그인 / 설정 ===== */
function applyLang(){L=T[S.lang];document.documentElement.lang=S.lang;document.documentElement.dir=S.lang==='ar'?'rtl':'ltr';
 document.querySelectorAll('[data-i]').forEach(e=>e.textContent=L[e.dataset.i]);
 document.querySelectorAll('[data-l]').forEach(b=>b.classList.toggle('sel',b.dataset.l===S.lang));
 document.querySelectorAll('[data-c]').forEach(b=>b.classList.toggle('sel',b.dataset.c===S.ch));
 for(const id of['citySel','citySel2']){const s=$(id);s.innerHTML='';CITIES.forEach(c=>{const o=document.createElement('option');o.value=c[0];o.textContent=c[4][S.lang];s.append(o)});s.value=S.city}
 $('pvLbl').textContent='+'+pvOff+'h';hud()}
document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{S.lang=b.dataset.l;save();applyLang()});
document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{S.ch=b.dataset.c;buildHero();applyLang()});
for(const id of['citySel','citySel2'])$(id).onchange=e=>{S.city=e.target.value;save();applySun();applyLang()};
$('pv').oninput=e=>{pvOff=+e.target.value;$('pvLbl').textContent='+'+pvOff+'h';applySun();hud()};
$('nick').value=S.name;
$('enter').onclick=()=>{S.name=$('nick').value.trim().slice(0,12)||'Guest';save();setTag();close('login')};
applyLang();

/* ===== 루프 ===== */
let last=performance.now(),slow=0;const loginEl=$('login');
function frame(t){const dt=Math.min(.1,(t-last)/1e3);last=t;slow+=dt;const intro=loginEl.classList.contains('on');
 if(slow>.5){slow=0;applySun();hud()}
 if(!intro)update(dt,t);sync(dt,t,intro);rnd.render(scene,cam);requestAnimationFrame(frame)}
applySun();setTag();cam.position.set(CX,360,CY+640);requestAnimationFrame(frame);
